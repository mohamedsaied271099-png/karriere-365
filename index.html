<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Karriere 365</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="top-start">
      <button id="menu" class="top-btn" aria-label="القايمة"></button>
      <button id="home" class="top-btn" aria-label="الرئيسية"></button>
      <div class="brand" id="title">Karriere 365</div>
    </div>
    <div class="stats">
      <span title="أيام متتالية" id="streakBox"><b id="streak">0</b></span>
      <span title="نقاط الخبرة" id="xpBox"><b id="xp">0</b></span>
      <a id="gear" class="top-btn show" href="#/settings" aria-label="الإعدادات"></a>
    </div>
  </header>

  <div class="shell">
    <aside id="side"></aside>
    <main id="view"></main>
  </div>
  <div id="scrim"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
