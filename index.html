<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Karriere 365</title>
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="top-start">
      <button id="menu" class="top-btn" aria-label="القايمة">☰</button>
      <button id="home" class="top-btn" aria-label="الرئيسية">🏠</button>
      <div class="brand" id="title">🚚 Karriere 365</div>
    </div>
    <div class="stats">
      <span title="أيام متتالية">🔥 <b id="streak">0</b></span>
      <span title="نقاط الخبرة">⭐ <b id="xp">0</b></span>
    </div>
  </header>

  <div class="shell">
    <aside id="side"></aside>
    <main id="view"></main>
  </div>
  <div id="scrim"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
